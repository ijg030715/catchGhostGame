<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>손전등 유령 사냥</title>
<style>
  :root{
    --ink:#f3eefc; --muted:#b9acd6; --panel:rgba(24,17,36,.9); --line:rgba(255,255,255,.12);
    --accent:#ffd36b; --accent-ink:#2a1d05; --accent-shadow:#b8892a;
    --danger:#ff6b6b; --warn:#ffd166; --ok:#7be38a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  body.playing #game{cursor:none}

  /* 점수판 */
  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 18px;
    background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,0));pointer-events:none;opacity:0;transition:opacity .3s}
  body.playing #hud, body.ending #hud{opacity:1}
  .stat{display:flex;flex-direction:column;gap:3px;min-width:0}
  .stat .label{font-size:11px;color:var(--muted)}
  .stat b{font-size:18px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
  #lives{font-size:16px;line-height:1.15;letter-spacing:2px;white-space:nowrap;display:inline-block}
  #lives .lost{opacity:.2;filter:grayscale(1)}
  #lives.hit{animation:shake .45s}
  .battery .row{display:flex;align-items:center;gap:6px}
  .bar{width:64px;height:11px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.28)}
  .bar i{display:block;height:100%;width:100%;background:var(--ok);transition:background .3s}
  #battPct{font-size:14px}
  .battery.low .bar i{animation:blink .6s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  /* 시작 · 게임오버 화면 */
  .screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));background:rgba(5,3,10,.5)}
  .screen.show{display:flex}
  .panel{width:min(430px,100%);max-height:100%;overflow:auto;touch-action:pan-y;
    background:var(--panel);border:1px solid var(--line);border-radius:22px;
    padding:26px 20px 20px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.7);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .big{font-size:44px;line-height:1}
  h1{font-size:28px;font-weight:800;margin:10px 0 6px;letter-spacing:-.01em;color:#fff;text-shadow:0 0 18px rgba(255,211,107,.35)}
  .intro{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:16px;word-break:keep-all}
  .how{list-style:none;text-align:left;font-size:14px;line-height:1.5;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:7px;word-break:keep-all}
  .how b{color:var(--accent);margin-right:4px}
  .pair{display:flex;gap:10px;margin:12px 0 18px}
  .card{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 6px 12px}
  .card canvas{width:76px;height:76px;display:block;margin:0 auto 4px}
  .card .t{font-weight:800;font-size:15px}
  .card .d{font-size:12px;color:var(--muted);margin-top:2px;word-break:keep-all}
  .card.bad .t{color:#ffb4a8}
  .result{display:flex;gap:10px;margin:4px 0 18px}
  .result div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
  .result span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .result b{font-size:26px;font-variant-numeric:tabular-nums}
  button.go{appearance:none;border:0;width:100%;cursor:pointer;font:inherit;font-weight:800;font-size:18px;
    padding:15px 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
    box-shadow:0 6px 0 var(--accent-shadow);transition:transform .05s}
  button.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-shadow)}
  button.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .key{font-size:12px;color:var(--muted);margin-top:12px}
  @media (hover:none){.key{display:none}}
  @media (max-height:640px){.big{font-size:34px} h1{font-size:24px} .intro{margin-bottom:10px} .card canvas{width:60px;height:60px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat"><span class="label">점수</span><b id="score">0</b></div>
  <div class="stat"><span class="label">퇴치</span><b id="kills">0 / 20</b></div>
  <div class="stat"><span class="label">남은 기회</span><span id="lives"></span></div>
  <div class="stat battery" id="battBox"><span class="label">배터리</span>
    <div class="row"><div class="bar"><i id="batt"></i></div><b id="battPct">100%</b></div></div>
</div>

<div id="start" class="screen show">
  <div class="panel">
    <div class="big">🔦</div>
    <h1>손전등 유령 사냥</h1>
    <p class="intro">어두운 저택에서 손전등으로 숨은 유령을 찾아내는 반응 속도 게임</p>
    <ul class="how">
      <li><b>PC</b>마우스로 불빛을 움직이고, 유령이 보이면 클릭!</li>
      <li><b>폰</b>화면을 문질러 비추고, 유령이 보이면 터치!</li>
      <li><b>목표</b>유령 20마리 퇴치하기</li>
      <li><b>실패</b>배터리가 다 닳거나, 유령을 3마리 놓치면 끝</li>
    </ul>
    <div class="pair">
      <div class="card"><canvas id="cvGhost"></canvas><div class="t">유령</div><div class="d">찾아서 잡으면 +100</div></div>
      <div class="card bad"><canvas id="cvDoll"></canvas><div class="t">가짜 인형</div><div class="d">누르면 점수 −50</div></div>
    </div>
    <button class="go" id="startBtn">시작하기</button>
    <p class="key">Enter 키를 눌러도 시작돼요</p>
  </div>
</div>

<div id="over" class="screen">
  <div class="panel">
    <div class="big" id="overEmoji">👻</div>
    <h1 id="overTitle">게임 오버</h1>
    <p class="intro" id="overReason"></p>
    <div class="result">
      <div><span>점수</span><b id="finalScore">0</b></div>
      <div><span>퇴치한 유령</span><b id="finalKills">0 / 20</b></div>
    </div>
    <button class="go" id="retryBtn">다시 하기</button>
    <p class="key">Enter 키를 눌러도 다시 시작돼요</p>
  </div>
</div>

<script>
// ===== 설정 =====
const GOAL = 20;          // 퇴치 목표
const MAX_MISS = 3;       // 놓쳐도 되는 유령 수
const BATTERY_SEC = 75;   // 배터리가 버티는 시간(초)
const GHOST_PTS = 100;
const DOLL_PENALTY = 50;
const FONT = '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
const hud = document.getElementById('hud');
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1, R = 120, GS = 60, TOP = 64;
let pointerType = 'mouse';

const S = {
  mode: 'start', t: 0,
  score: 0, kills: 0, misses: 0, battery: 100,
  ents: [], fx: [], texts: [],
  nextSpawn: 0, wave: 0,
  endAt: 0, endReason: '',
  light: { x: 0, y: 0 }, lightScale: 1, flickerUntil: 0
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(c, x, y, w, h, r){ r = Math.min(r, w/2, h/2); c.beginPath(); c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r); c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath(); }

// ===== 화면 크기 =====
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bg.width = cv.width; bg.height = cv.height;
  const m = Math.min(W, H);
  R = clamp(m * 0.22, 86, 150);
  GS = clamp(m * 0.12, 50, 82);
  TOP = hud.offsetHeight || 64;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawMansion(bctx, W, H);
  if (!S.light.x && !S.light.y){ S.light.x = W / 2; S.light.y = H * 0.55; }
  S.light.x = clamp(S.light.x, 0, W); S.light.y = clamp(S.light.y, 0, H);
  for (const e of S.ents){ e.x = clamp(e.x, e.s, W - e.s); e.y = clamp(e.y, TOP + e.s, H - e.s); }
}

// ===== 저택 배경 (도형으로 그리기) =====
function drawMansion(c, w, h){
  const rnd = mulberry32(20261001);
  const k = clamp(Math.min(h / 820, w / 500), 0.7, 1.25);
  const floorY = Math.round(h * 0.84), wainY = Math.round(h * 0.66);

  // 벽지
  let g = c.createLinearGradient(0, 0, 0, wainY);
  g.addColorStop(0, '#34274b'); g.addColorStop(1, '#281e39');
  c.fillStyle = g; c.fillRect(0, 0, w, wainY);
  c.fillStyle = 'rgba(255,255,255,.035)';
  for (let x = 0; x < w; x += 48) c.fillRect(x, 0, 20, wainY);
  c.fillStyle = 'rgba(205,175,255,.08)';
  for (let y = 44, row = 0; y < wainY - 20; y += 56, row++){
    for (let x = (row % 2 ? 34 : 10); x < w; x += 48){
      c.beginPath(); c.moveTo(x, y - 9); c.lineTo(x + 6, y); c.lineTo(x, y + 9); c.lineTo(x - 6, y); c.closePath(); c.fill();
    }
  }
  c.fillStyle = '#160f20'; c.fillRect(0, 0, w, 16);
  c.fillStyle = '#4a3a63'; c.fillRect(0, 16, w, 3);

  // 나무 벽판
  g = c.createLinearGradient(0, wainY, 0, floorY);
  g.addColorStop(0, '#3c251a'); g.addColorStop(1, '#2a1911');
  c.fillStyle = g; c.fillRect(0, wainY, w, floorY - wainY);
  const ph = floorY - wainY - 30, pw = Math.max(80, 110 * k);
  for (let x = 16; x + pw <= w - 8; x += pw + 18){
    c.strokeStyle = '#21140c'; c.lineWidth = 4; c.strokeRect(x, wainY + 15, pw, ph);
    c.strokeStyle = 'rgba(255,210,160,.08)'; c.lineWidth = 1.5; c.strokeRect(x + 6, wainY + 21, pw - 12, ph - 12);
  }
  c.fillStyle = '#55382a'; c.fillRect(0, wainY - 5, w, 9);
  c.fillStyle = 'rgba(255,220,180,.14)'; c.fillRect(0, wainY - 5, w, 2);

  // 마루
  g = c.createLinearGradient(0, floorY, 0, h);
  g.addColorStop(0, '#3b2416'); g.addColorStop(1, '#1c100a');
  c.fillStyle = g; c.fillRect(0, floorY, w, h - floorY);
  c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1.5;
  for (let y = floorY + 4, i = 0; y < h; i++){
    const rowH = 12 + i * 4;
    c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
    let sx = rnd() * 120;
    while (sx < w){ c.beginPath(); c.moveTo(sx, y); c.lineTo(sx, y + rowH); c.stroke(); sx += 110 + rnd() * 90; }
    y += rowH;
  }
  c.fillStyle = '#120a06'; c.fillRect(0, floorY - 3, w, 7);

  // 카펫
  const rx = w / 2, ry = floorY + (h - floorY) * 0.58, rw = Math.min(w * 0.36, 280), rh = Math.max(14, (h - floorY) * 0.3);
  c.fillStyle = '#5a1d2a'; c.beginPath(); c.ellipse(rx, ry, rw, rh, 0, 0, Math.PI * 2); c.fill();
  c.setLineDash([6, 5]); c.strokeStyle = '#c79a4a'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(rx, ry, rw * 0.86, rh * 0.72, 0, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#481521'; c.beginPath(); c.ellipse(rx, ry, rw * 0.6, rh * 0.45, 0, 0, Math.PI * 2); c.fill();

  // 가구 배치
  const seq = ['shelf','window','clock','portrait','chair','window','table','shelf','portrait','window','clock','chair','window','portrait','table'];
  const dims = { shelf:[130,230], window:[110,175], clock:[58,225], portrait:[78,98], chair:[112,100], table:[56,92] };
  const floorItems = { shelf:1, clock:1, chair:1, table:1 };
  let x = 14 + rnd() * 10;
  for (const name of seq){
    const iw = dims[name][0] * k, ih = dims[name][1] * k;
    if (x + iw > w - 10) continue;
    if (floorItems[name]){
      const bottom = floorY + 6;
      const top = bottom - ih;
      if (name === 'shelf') fShelf(c, x, bottom, iw, ih, rnd);
      if (name === 'clock') fClock(c, x, bottom, iw, ih);
      if (name === 'chair') fChair(c, x, bottom, iw, ih);
      if (name === 'table') fTable(c, x, bottom, iw, ih);
      const fw = 58 * k, fh = 72 * k;
      if (top - 19 > fh + 60 && iw > 40 * k){
        const fx = x + iw / 2 - fw / 2;
        fPortrait(c, fx, 19 + (top - 19 - fh) * 0.45, fw, fh, rnd);
      }
    } else {
      const top = 19 + (wainY - 19 - ih) / 2 - 8;
      if (name === 'window') fWindow(c, x, top, iw, ih, rnd);
      if (name === 'portrait') fPortrait(c, x, top + ih * 0.15, iw, ih, rnd);
    }
    x += iw + (30 + rnd() * 26) * k;
  }

  fChandelier(c, w / 2, Math.min(h * 0.16, 120), k);
  fWeb(c, 0, 19, 1, 1, 90 * k);
  fWeb(c, w, 19, -1, 1, 70 * k);
}

function fWindow(c, x, top, w, h, rnd){
  const cx = x + w / 2;
  const arch = () => { c.beginPath(); c.moveTo(x, top + w / 2); c.arc(cx, top + w / 2, w / 2, Math.PI, 0); c.lineTo(x + w, top + h); c.lineTo(x, top + h); c.closePath(); };
  c.save();
  arch();
  const g = c.createLinearGradient(0, top, 0, top + h);
  g.addColorStop(0, '#273866'); g.addColorStop(1, '#101832');
  c.fillStyle = g; c.fill(); c.clip();
  c.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 10; i++) c.fillRect(x + rnd() * w, top + rnd() * h * 0.7, 1.6, 1.6);
  const mx = x + w * 0.66, my = top + w * 0.42, mr = w * 0.15;
  const mg = c.createRadialGradient(mx, my, 0, mx, my, mr * 3.2);
  mg.addColorStop(0, 'rgba(255,245,200,.4)'); mg.addColorStop(1, 'rgba(255,245,200,0)');
  c.fillStyle = mg; c.fillRect(x, top, w, h);
  c.fillStyle = '#f5ecc6'; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(170,160,120,.35)';
  c.beginPath(); c.arc(mx - mr * 0.3, my + mr * 0.2, mr * 0.22, 0, 7); c.fill();
  c.beginPath(); c.arc(mx + mr * 0.35, my - mr * 0.25, mr * 0.15, 0, 7); c.fill();
  c.strokeStyle = '#090d1b'; c.lineWidth = 3.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, top + h * 0.8); c.quadraticCurveTo(x + w * 0.3, top + h * 0.62, x + w * 0.48, top + h * 0.38);
  c.moveTo(x + w * 0.24, top + h * 0.66); c.lineTo(x + w * 0.16, top + h * 0.48);
  c.moveTo(x + w * 0.38, top + h * 0.52); c.lineTo(x + w * 0.55, top + h * 0.5); c.stroke();
  c.restore();
  c.strokeStyle = '#3d2a1b'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(cx, top); c.lineTo(cx, top + h); c.moveTo(x, top + h * 0.58); c.lineTo(x + w, top + h * 0.58); c.stroke();
  c.lineWidth = 7; arch(); c.stroke();
  c.fillStyle = '#4a3020'; c.fillRect(x - 8, top + h, w + 16, 8);
  // 커튼
  const half = w / 2;
  for (const side of [-1, 1]){
    c.save(); c.translate(cx, 0); c.scale(side, 1);
    const outer = -half - 16, innerTop = -half + w * 0.24, tieX = -half + 4, tieY = top + h * 0.56;
    c.fillStyle = '#5e1b2c';
    c.beginPath(); c.moveTo(outer, top - 14); c.lineTo(innerTop, top - 14);
    c.quadraticCurveTo(-half + w * 0.2, top + h * 0.35, tieX, tieY);
    c.quadraticCurveTo(-half + w * 0.06, top + h * 0.8, -half + w * 0.14, top + h + 18);
    c.lineTo(outer, top + h + 18); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(outer + 7, top - 10); c.lineTo(outer + 6, top + h + 16);
    c.moveTo(outer + 15, top - 10); c.quadraticCurveTo(outer + 18, tieY, outer + 16, top + h + 16); c.stroke();
    c.fillStyle = '#c79a4a'; c.beginPath(); c.ellipse(tieX - 6, tieY, 9, 4, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.strokeStyle = '#8a6a2c'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(x - 24, top - 16); c.lineTo(x + w + 24, top - 16); c.stroke();
  c.fillStyle = '#8a6a2c';
  c.beginPath(); c.arc(x - 26, top - 16, 5, 0, 7); c.arc(x + w + 26, top - 16, 5, 0, 7); c.fill();
}

function fPortrait(c, x, top, w, h, rnd){
  c.save();
  c.translate(x + w / 2, top); c.rotate((rnd() - 0.5) * 0.12); c.translate(-w / 2, 0);
  c.strokeStyle = 'rgba(160,140,90,.5)'; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(w * 0.15, 4); c.lineTo(w / 2, -h * 0.22); c.lineTo(w * 0.85, 4); c.stroke();
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#3f2c30'); g.addColorStop(1, '#1d1418');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = '#120b10';
  c.beginPath(); c.arc(w / 2, h * 0.42, w * 0.17, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(w * 0.16, h); c.quadraticCurveTo(w / 2, h * 0.48, w * 0.84, h); c.closePath(); c.fill();
  c.strokeStyle = '#9a7631'; c.lineWidth = Math.max(5, w * 0.1); c.strokeRect(0, 0, w, h);
  c.strokeStyle = '#5e461b'; c.lineWidth = 1.5; c.strokeRect(w * 0.08, w * 0.08, w - w * 0.16, h - w * 0.16);
  c.restore();
}

function fClock(c, x, bottom, w, h){
  const top = bottom - h, cx = x + w / 2;
  c.fillStyle = '#3b2416';
  c.beginPath(); c.moveTo(x, bottom); c.lineTo(x, top + w * 0.5); c.arc(cx, top + w * 0.5, w / 2, Math.PI, 0); c.lineTo(x + w, bottom); c.closePath(); c.fill();
  c.strokeStyle = '#22140b'; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#2c1a10'; c.fillRect(x - 4, bottom - h * 0.1, w + 8, h * 0.1);
  c.fillStyle = '#e7dcc0'; c.beginPath(); c.arc(cx, top + w * 0.55, w * 0.34, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#9a7631'; c.lineWidth = 3; c.stroke();
  c.strokeStyle = '#2a1d12'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(cx, top + w * 0.55); c.lineTo(cx - w * 0.12, top + w * 0.42);
  c.moveTo(cx, top + w * 0.55); c.lineTo(cx + w * 0.2, top + w * 0.6); c.stroke();
  c.fillStyle = '#160c07'; c.fillRect(x + w * 0.24, top + h * 0.42, w * 0.52, h * 0.36);
  c.strokeStyle = '#9a7631'; c.lineWidth = 2; c.strokeRect(x + w * 0.24, top + h * 0.42, w * 0.52, h * 0.36);
  c.beginPath(); c.moveTo(cx, top + h * 0.43); c.lineTo(cx + w * 0.06, top + h * 0.68); c.stroke();
  c.fillStyle = '#c9a24a'; c.beginPath(); c.arc(cx + w * 0.06, top + h * 0.7, w * 0.1, 0, Math.PI * 2); c.fill();
}

function fShelf(c, x, bottom, w, h, rnd){
  const top = bottom - h;
  c.fillStyle = '#3a2416'; c.fillRect(x, top, w, h);
  c.fillStyle = '#1c110a'; c.fillRect(x + 7, top + 10, w - 14, h - 17);
  c.fillStyle = '#2c1a10'; c.fillRect(x - 5, top - 6, w + 10, 8);
  const colors = ['#7a2f2f','#2f4f7a','#5a6b2d','#7a6430','#4f2f7a','#2d6b5a','#8a4a2a'];
  const n = 4, sh = (h - 17) / n;
  for (let i = 0; i < n; i++){
    const y = top + 10 + (i + 1) * sh;
    c.fillStyle = '#3a2416'; c.fillRect(x + 7, y - 5, w - 14, 5);
    let bx = x + 10;
    while (bx < x + w - 16){
      const bw = 6 + rnd() * 8, bh = (sh - 8) * (0.55 + rnd() * 0.4);
      if (bx + bw > x + w - 9) break;
      c.fillStyle = colors[Math.floor(rnd() * colors.length)];
      c.fillRect(bx, y - 5 - bh, bw, bh);
      c.fillStyle = 'rgba(255,220,150,.25)'; c.fillRect(bx + 1, y - 5 - bh * 0.7, bw - 2, 1.5);
      bx += bw + 1;
      if (rnd() < 0.12) bx += 10;
    }
  }
}

function fChair(c, x, bottom, w, h){
  const top = bottom - h;
  c.fillStyle = '#5a1f2e'; rr(c, x + w * 0.12, top, w * 0.76, h * 0.7, 18); c.fill();
  c.fillStyle = 'rgba(0,0,0,.3)';
  for (const [px, py] of [[0.35,0.2],[0.65,0.2],[0.5,0.38],[0.35,0.5],[0.65,0.5]]){ c.beginPath(); c.arc(x + w * px, top + h * py, 2.2, 0, 7); c.fill(); }
  c.fillStyle = '#6b2637'; rr(c, x + w * 0.1, top + h * 0.55, w * 0.8, h * 0.24, 8); c.fill();
  c.fillStyle = '#4e1a28'; rr(c, x, top + h * 0.36, w * 0.2, h * 0.47, 10); c.fill();
  rr(c, x + w * 0.8, top + h * 0.36, w * 0.2, h * 0.47, 10); c.fill();
  c.fillStyle = '#22140b';
  c.fillRect(x + w * 0.08, bottom - h * 0.18, 6, h * 0.18); c.fillRect(x + w * 0.92 - 6, bottom - h * 0.18, 6, h * 0.18);
}

function fTable(c, x, bottom, w, h){
  const top = bottom - h * 0.6, cx = x + w / 2;
  c.fillStyle = '#4a2e1e'; c.fillRect(x - 4, top, w + 8, 7);
  c.fillStyle = '#2c1a10'; c.fillRect(x + 4, top + 7, 5, bottom - top - 7); c.fillRect(x + w - 9, top + 7, 5, bottom - top - 7);
  c.fillRect(x + 4, top + (bottom - top) * 0.6, w - 8, 3);
  c.fillStyle = '#c9a24a'; c.fillRect(cx - 9, top - 4, 18, 4); c.fillRect(cx - 2, top - 16, 4, 12); c.fillRect(cx - 6, top - 18, 12, 3);
  c.fillStyle = '#efe6d0'; c.fillRect(cx - 4, top - 18 - h * 0.25, 8, h * 0.25);
  const fy = top - 18 - h * 0.25;
  const fg = c.createRadialGradient(cx, fy - 6, 0, cx, fy - 6, 26);
  fg.addColorStop(0, 'rgba(255,190,90,.45)'); fg.addColorStop(1, 'rgba(255,190,90,0)');
  c.fillStyle = fg; c.fillRect(cx - 26, fy - 32, 52, 52);
  c.fillStyle = '#ffb347'; c.beginPath(); c.moveTo(cx, fy - 13); c.quadraticCurveTo(cx + 5, fy - 4, cx, fy); c.quadraticCurveTo(cx - 5, fy - 4, cx, fy - 13); c.fill();
}

function fChandelier(c, cx, y, k){
  c.strokeStyle = '#6b5420'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(cx, 19); c.lineTo(cx, y); c.stroke();
  c.fillStyle = '#9a7631'; c.beginPath(); c.ellipse(cx, y + 8 * k, 22 * k, 7 * k, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#9a7631'; c.lineWidth = 3;
  for (const d of [-1, -0.5, 0.5, 1]){
    const ex = cx + d * 52 * k, ey = y + 4 * k;
    c.beginPath(); c.moveTo(cx, y + 10 * k); c.quadraticCurveTo(cx + d * 30 * k, y + 32 * k, ex, ey); c.stroke();
    c.fillStyle = '#e8dfc8'; c.fillRect(ex - 3, ey - 14 * k, 6, 14 * k);
    c.fillStyle = 'rgba(160,140,120,.6)'; c.beginPath(); c.arc(ex, ey + 12 * k, 3, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(200,220,255,.5)';
  for (const d of [-0.7, -0.25, 0.25, 0.7]){ c.beginPath(); c.arc(cx + d * 40 * k, y + 22 * k, 2.5, 0, 7); c.fill(); }
}

function fWeb(c, x, y, sx, sy, size){
  c.strokeStyle = 'rgba(225,225,240,.28)'; c.lineWidth = 1;
  const rays = 6, pts = [];
  for (let i = 0; i < rays; i++){
    const a = (i / (rays - 1)) * Math.PI / 2;
    pts.push([Math.cos(a), Math.sin(a)]);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + sx * Math.cos(a) * size, y + sy * Math.sin(a) * size); c.stroke();
  }
  for (let j = 1; j <= 4; j++){
    const r = size * j / 4.4;
    c.beginPath();
    for (let i = 0; i < rays - 1; i++){
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const mx = (ax + bx) / 2 * r * 0.82, my = (ay + by) / 2 * r * 0.82;
      if (i === 0) c.moveTo(x + sx * ax * r, y + sy * ay * r);
      c.quadraticCurveTo(x + sx * mx, y + sy * my, x + sx * bx * r, y + sy * by * r);
    }
    c.stroke();
  }
}

// ===== 유령 · 인형 그리기 =====
function drawGhost(c, x, y, s, t, kind, a, sc, rot){
  const r = s / 2, doll = kind === 'doll';
  c.save();
  c.globalAlpha = a; c.translate(x, y); c.rotate(rot || 0); c.scale(sc, sc); c.translate(0, -r * 0.25);
  if (doll){
    c.strokeStyle = 'rgba(225,215,195,.75)'; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(0, -r); c.lineTo(0, -r - s * 3); c.stroke();
  }
  const by = r * 1.05, n = 4, step = 2 * r / n;
  c.beginPath(); c.moveTo(-r, 0); c.arc(0, 0, r, Math.PI, 0); c.lineTo(r, by);
  for (let i = 0; i < n; i++){
    const x0 = r - i * step, x1 = x0 - step, mx = (x0 + x1) / 2;
    const wv = doll ? 0 : Math.sin(t * 5 + i * 1.7) * r * 0.08;
    c.quadraticCurveTo(mx, by + r * 0.42 + wv, x1, by);
  }
  c.closePath();
  const g = c.createLinearGradient(0, -r, 0, by + r * 0.4);
  if (doll){ g.addColorStop(0, '#f2dfbd'); g.addColorStop(1, '#c9aa7e'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d8ddf3'); c.shadowColor = 'rgba(190,210,255,.8)'; c.shadowBlur = s * 0.35; }
  c.fillStyle = g; c.fill();
  c.shadowBlur = 0; c.shadowColor = 'transparent';
  c.lineWidth = Math.max(1.5, s * 0.03); c.strokeStyle = doll ? '#9c7d55' : 'rgba(120,130,175,.55)'; c.stroke();
  c.lineCap = 'round';
  if (doll){
    c.save(); c.translate(r * 0.4, r * 0.74); c.rotate(-0.15);
    c.fillStyle = '#b98fb0'; c.fillRect(-r * 0.2, -r * 0.17, r * 0.4, r * 0.34);
    c.setLineDash([3, 3]); c.strokeStyle = '#5b3b52'; c.lineWidth = 1.3; c.strokeRect(-r * 0.2, -r * 0.17, r * 0.4, r * 0.34);
    c.restore();
    for (const sx of [-1, 1]){
      const ex = sx * r * 0.36, ey = -r * 0.05;
      c.fillStyle = '#4a2e22'; c.beginPath(); c.arc(ex, ey, r * 0.18, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#f2dfbd'; c.lineWidth = Math.max(1.5, r * 0.06);
      const q = r * 0.08;
      c.beginPath(); c.moveTo(ex - q, ey - q); c.lineTo(ex + q, ey + q); c.moveTo(ex + q, ey - q); c.lineTo(ex - q, ey + q); c.stroke();
    }
    c.strokeStyle = '#6b4a33'; c.lineWidth = Math.max(1.2, r * 0.05);
    c.beginPath(); c.moveTo(-r * 0.28, r * 0.38); c.lineTo(r * 0.28, r * 0.38);
    for (let i = -2; i <= 2; i++){ const mx = i * r * 0.12; c.moveTo(mx, r * 0.3); c.lineTo(mx, r * 0.46); }
    c.stroke();
  } else {
    for (const sx of [-1, 1]){
      const ex = sx * r * 0.34, ey = -r * 0.08;
      c.fillStyle = '#1d1a2b'; c.beginPath(); c.ellipse(ex, ey, r * 0.13, r * 0.19, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + r * 0.04, ey - r * 0.07, r * 0.05, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = '#3a2140'; c.beginPath(); c.ellipse(0, r * 0.32, r * 0.11, r * 0.15, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,140,175,.45)';
    for (const sx of [-1, 1]){ c.beginPath(); c.ellipse(sx * r * 0.6, r * 0.18, r * 0.13, r * 0.08, 0, 0, Math.PI * 2); c.fill(); }
  }
  c.restore();
}

function drawEnt(e, t){
  if (!e.rev) return;
  const bob = Math.sin(t * 2.4 + e.ph) * e.s * 0.06;
  let y = e.y + bob, a = 1, rot = 0;
  let sc = 0.35 + 0.65 * easeOutBack(Math.min(1, (t - e.revT) / 0.32));
  if (e.st === 'caught'){ const q = Math.min(1, (t - e.stT) / 0.3); sc *= 1 + 0.45 * q; a = 1 - q; }
  if (e.st === 'esc'){ const q = Math.min(1, (t - e.stT) / 0.7); y -= e.s * 1.6 * q; a = 1 - q; }
  if (e.st === 'gone'){ a = 1 - Math.min(1, (t - e.stT) / 0.35); }
  if (e.st === 'fooled'){ const q = Math.min(1, (t - e.stT) / 0.6); rot = Math.sin(q * 30) * 0.3 * (1 - q); y += e.s * 0.9 * q * q; a = 1 - q; }
  if (a <= 0) return;
  drawGhost(ctx, e.x, y, e.s, t + e.ph, e.kind, a, sc, rot);
}

// ===== 효과 =====
function addText(x, y, text, color, dur = 0.9, size = 20){ S.texts.push({ x, y, text, color, born: S.t, dur, size }); }
function puff(x, y, s){
  for (let i = 0; i < 12; i++){
    const a = Math.random() * Math.PI * 2, sp = s * (1.2 + Math.random() * 1.6);
    S.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - s * 0.4, born: S.t, dur: 0.55 + Math.random() * 0.25, r: s * (0.08 + Math.random() * 0.08), star: i % 3 === 0 });
  }
}
function drawFx(p, t){
  const q = (t - p.born) / p.dur; if (q >= 1) return;
  const x = p.x + p.vx * q * (1 - q * 0.4), y = p.y + p.vy * q * (1 - q * 0.4);
  ctx.globalAlpha = 1 - q;
  if (p.star){
    ctx.fillStyle = '#ffe58a'; const r = p.r * 1.4;
    ctx.beginPath();
    for (let i = 0; i < 8; i++){ const ang = i * Math.PI / 4, rad = i % 2 ? r * 0.35 : r; ctx.lineTo(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad); }
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, p.r * (1 + q), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawText(o, t){
  const q = (t - o.born) / o.dur; if (q >= 1) return;
  const y = o.y - 34 * q;
  ctx.globalAlpha = q < 0.6 ? 1 : 1 - (q - 0.6) / 0.4;
  ctx.font = `800 ${o.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,5,20,.9)'; ctx.lineJoin = 'round';
  ctx.strokeText(o.text, o.x, y); ctx.fillStyle = o.color; ctx.fillText(o.text, o.x, y);
  ctx.globalAlpha = 1;
}

// ===== 게임 진행 =====
function findSpot(placed, s){
  const m = s * 0.8;
  let best = null, bestScore = -Infinity;
  for (let i = 0; i < 80; i++){
    const x = m + Math.random() * (W - 2 * m);
    const y = TOP + m + Math.random() * Math.max(1, H - TOP - 2 * m);
    let score = Math.hypot(x - S.light.x, y - S.light.y) - (R + s);
    for (const o of placed) score = Math.min(score, Math.hypot(x - o.x, y - o.y) - s * 1.8);
    if (score > 0) return { x, y };
    if (score > bestScore){ bestScore = score; best = { x, y }; }
  }
  return best;
}
function makeEnt(kind, life, placed){
  const p = findSpot(placed, GS);
  return { kind, wave: S.wave, x: p.x, y: p.y, s: GS, born: S.t, life, rev: false, revT: 0, st: 'live', stT: 0, ph: Math.random() * 6.28 };
}
function spawnWave(){
  const k = S.kills, p = Math.min(1, k / (GOAL - 1));
  const life = 5.5 - 2.5 * p;           // 유령이 머무는 시간: 5.5초 → 3초
  S.wave++;
  const placed = [];
  placed.push(makeEnt('ghost', life, placed));
  let dolls = 0;                          // 가짜 인형: 4마리 퇴치 후부터 등장
  if (k >= 4){
    if (Math.random() < 0.35 + 0.45 * p) dolls++;
    if (k >= 12 && Math.random() < 0.4) dolls++;
  }
  for (let i = 0; i < dolls; i++) placed.push(makeEnt('doll', life, placed));
  S.ents.push(...placed);
}
function clearWave(w){
  for (const e of S.ents) if (e.wave === w && e.st === 'live'){ e.st = 'gone'; e.stT = S.t; }
}
function escape(e){
  e.st = 'esc'; e.stT = S.t;
  S.misses++;
  addText(e.x, e.y, '놓쳤어요!', '#ff9a9a', 1.1, 22);
  clearWave(e.wave);
  const lv = $('lives'); lv.classList.remove('hit'); void lv.offsetWidth; lv.classList.add('hit');
  if (S.misses >= MAX_MISS) endGame('miss');
  else S.nextSpawn = S.t + 0.9;
}
function tryCatch(x, y, isTouch){
  if (S.mode !== 'play') return;
  const pad = isTouch ? 14 : 4;
  let best = null, bd = Infinity;
  for (const e of S.ents){
    if (e.st !== 'live' || !e.rev) continue;
    const bob = Math.sin(S.t * 2.4 + e.ph) * e.s * 0.06;
    const d = Math.hypot(e.x - x, e.y + bob - y);
    if (d < e.s * 0.6 + pad && d < bd){ best = e; bd = d; }
  }
  if (!best) return;
  best.stT = S.t;
  if (best.kind === 'ghost'){
    best.st = 'caught';
    S.kills++; S.score += GHOST_PTS;
    puff(best.x, best.y, best.s);
    addText(best.x, best.y - best.s * 0.7, '+' + GHOST_PTS, '#ffe58a', 0.9, 24);
    clearWave(best.wave);
    if (S.kills >= GOAL) endGame('win');
    else S.nextSpawn = S.t + 0.6;
  } else {
    best.st = 'fooled';
    S.score = Math.max(0, S.score - DOLL_PENALTY);
    addText(best.x, best.y - best.s * 0.7, '가짜 인형! −' + DOLL_PENALTY, '#ff9a9a', 1.0, 20);
  }
}

function startGame(){
  Object.assign(S, { mode: 'play', score: 0, kills: 0, misses: 0, battery: 100, ents: [], fx: [], texts: [],
    nextSpawn: S.t + 1.0, lightScale: 1, flickerUntil: 0, endReason: '' });
  $('start').classList.remove('show'); $('over').classList.remove('show');
  document.body.className = 'playing';
  TOP = hud.offsetHeight || 64;
  hudCache = {};
  addText(W / 2, Math.max(TOP + 40, H * 0.32), '유령을 찾아 보세요!', '#ffe08a', 1.5, 22);
}
function endGame(reason){
  if (S.mode !== 'play') return;
  S.mode = 'ending'; S.endReason = reason; S.endAt = S.t + (reason === 'win' ? 1.0 : 1.2);
  for (const e of S.ents) if (e.st === 'live'){ e.st = 'gone'; e.stT = S.t; }
  document.body.className = 'ending';
}
function showOver(){
  S.mode = 'over'; S.lightScale = 1;
  document.body.className = '';
  const win = S.endReason === 'win';
  $('overEmoji').textContent = win ? '🎉' : (S.endReason === 'battery' ? '🔦' : '👻');
  $('overTitle').textContent = win ? '퇴치 성공!' : '게임 오버';
  $('overReason').textContent = win ? '저택의 유령 20마리를 모두 퇴치했어요!'
    : (S.endReason === 'battery' ? '손전등 배터리가 다 닳았어요.' : '유령을 3마리 놓쳤어요.');
  $('finalScore').textContent = S.score;
  $('finalKills').textContent = S.kills + ' / ' + GOAL;
  $('over').classList.add('show');
}

function update(dt){
  const t = S.t;
  if (S.mode === 'play'){
    S.battery = Math.max(0, S.battery - dt * 100 / BATTERY_SEC);
    if (S.battery < 20 && t > S.flickerUntil && Math.random() < dt * 2.5) S.flickerUntil = t + 0.05 + Math.random() * 0.08;
    if (S.battery <= 0) endGame('battery');
  }
  if (S.mode === 'play'){
    if (!S.ents.some(e => e.kind === 'ghost' && e.st === 'live') && t >= S.nextSpawn) spawnWave();
    for (const e of S.ents){
      if (e.st !== 'live') continue;
      const d = Math.hypot(e.x - S.light.x, e.y - S.light.y);
      if (!e.rev && d < R * 0.85 + e.s * 0.25){ e.rev = true; e.revT = t; }
      if (e.kind === 'ghost' && t - e.born > e.life){ escape(e); if (S.mode !== 'play') break; }
    }
  }
  if (S.mode === 'ending'){
    if (S.endReason === 'battery') S.lightScale = Math.max(0, S.lightScale - dt * 1.4);
    if (t >= S.endAt) showOver();
  }
  S.ents = S.ents.filter(e => e.st === 'live' || t - e.stT < 0.8);
  S.fx = S.fx.filter(p => t - p.born < p.dur);
  S.texts = S.texts.filter(o => t - o.born < o.dur);
  updateHud();
}

let hudCache = {};
function setText(id, v){ if (hudCache[id] !== v){ hudCache[id] = v; $(id).textContent = v; } }
function updateHud(){
  setText('score', String(S.score));
  setText('kills', S.kills + ' / ' + GOAL);
  const left = MAX_MISS - S.misses;
  if (hudCache.lives !== left){
    hudCache.lives = left;
    let h = '';
    for (let i = 0; i < MAX_MISS; i++) h += `<span class="${i < left ? '' : 'lost'}">❤️</span>`;
    $('lives').innerHTML = h;
  }
  const b = Math.ceil(S.battery);
  if (hudCache.batt !== b){
    hudCache.batt = b;
    const bar = $('batt');
    bar.style.width = b + '%';
    bar.style.background = b > 50 ? 'var(--ok)' : b > 20 ? 'var(--warn)' : 'var(--danger)';
    $('battPct').textContent = b + '%';
    $('battBox').classList.toggle('low', b <= 20);
  }
}

function render(){
  const t = S.t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  for (const e of S.ents) drawEnt(e, t);
  for (const p of S.fx) drawFx(p, t);

  // 어둠 + 손전등 불빛
  let r = R * S.lightScale;
  if (t < S.flickerUntil) r *= 0.8;
  const lx = S.light.x, ly = S.light.y;
  if (r > 2){
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.04)');
    g.addColorStop(0.82, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0.985)');
    ctx.fillStyle = g;
  } else ctx.fillStyle = 'rgba(0,0,0,0.985)';
  ctx.fillRect(0, 0, W, H);
  if (r > 2){
    const g2 = ctx.createRadialGradient(lx, ly, 0, lx, ly, r);
    g2.addColorStop(0, 'rgba(255,226,150,0.16)'); g2.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(lx, ly, r, 0, Math.PI * 2); ctx.fill();
  }
  if (S.mode === 'play' && pointerType !== 'touch'){
    ctx.strokeStyle = 'rgba(255,240,200,.65)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(lx, ly, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,200,.85)'; ctx.beginPath(); ctx.arc(lx, ly, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  for (const o of S.texts) drawText(o, t);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  S.t += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ===== 조작 =====
function setLight(x, y){ S.light.x = clamp(x, 0, W); S.light.y = clamp(y, 0, H); }
window.addEventListener('pointermove', e => {
  pointerType = e.pointerType;
  if (e.pointerType === 'touch' && S.mode === 'play' && e.target !== cv) return;
  setLight(e.clientX, e.clientY);
}, { passive: true });
cv.addEventListener('pointerdown', e => {
  pointerType = e.pointerType;
  setLight(e.clientX, e.clientY);
  tryCatch(e.clientX, e.clientY, e.pointerType === 'touch');
  e.preventDefault();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!e.target.closest('.panel')) e.preventDefault(); }, { passive: false });
$('startBtn').addEventListener('click', startGame);
$('retryBtn').addEventListener('click', startGame);
window.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && (S.mode === 'start' || S.mode === 'over')){ e.preventDefault(); startGame(); }
});
window.addEventListener('resize', resize);

// 시작 화면의 유령 · 인형 그림
function drawCard(id, kind){
  const c = $(id), d = Math.min(window.devicePixelRatio || 1, 2), size = 76;
  c.width = size * d; c.height = size * d;
  const x = c.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0);
  drawGhost(x, size / 2, size / 2 + 4, 44, 0.6, kind, 1, 1, 0);
}

resize();
drawCard('cvGhost', 'ghost');
drawCard('cvDoll', 'doll');
updateHud();
requestAnimationFrame(loop);
</script>
